name: Cron health

# فحص حي يومي: يستدعي مسارات كرون تمثيلية على الإنتاج فعلاً ويتحقق من
# الاستجابة — لا ثقة بحالة "Enabled" المعلنة بلا استدعاء حقيقي (درس 2026-10).
# السر من GitHub repo secret (CRON_SECRET) — لا يُكتب في الكود أبداً.
# يتطلب CRON_SECRET مضبوطاً في Vercel أيضاً (نفس القيمة) وإلا فشل الفحص بحق.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe worker/run
        run: |
          out=$(curl --max-time 10 -sf "https://manara-mmetwily.vercel.app/api/worker/run?secret=${{ secrets.CRON_SECRET }}") \
            || { echo "WORKER: HTTP-FAIL"; exit 1; }
          echo "$out" | grep -q '"ok":true' || { echo "WORKER: BAD-BODY: $out"; exit 1; }
          echo "WORKER: OK $out"

      - name: Probe sms/process
        run: |
          out=$(curl --max-time 10 -sf "https://manara-mmetwily.vercel.app/api/sms/process?secret=${{ secrets.CRON_SECRET }}") \
            || { echo "SMS: HTTP-FAIL"; exit 1; }
          echo "$out" | grep -q '"ok":true' || { echo "SMS: BAD-BODY: $out"; exit 1; }
          echo "SMS: OK $out"
